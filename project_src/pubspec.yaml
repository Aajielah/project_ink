name: project_ink
description: An offline-first personal writing productivity system.
version: 2.2.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Routing & Navigation
  go_router: ^14.2.0

  # Database & Local Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Charts & UI Components
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.3.3

  # File Management & Backup
  archive: ^3.6.1
  file_picker: ^8.0.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
