name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub website

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd project_src
          flutter pub get

      - name: Run Build Runner (Database Gen)
        run: |
          cd project_src
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run Unit Tests
        run: |
          cd project_src
          flutter test

      - name: Build Release APK
        run: |
          cd project_src
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-ink-release-apk
          path: project_src/build/app/outputs/flutter-apk/app-release.apk
