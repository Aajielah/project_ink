name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'Daily_Counter/**'
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub website

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd project_src
          flutter pub get

      - name: Run All Automated Tests
        run: |
          cd project_src
          flutter test

      - name: Build Release APK
        run: |
          cd project_src
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-ink-release-apk
          path: project_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
