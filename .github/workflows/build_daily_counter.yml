name: Build Daily Counter Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Daily_Counter/**'
      - '.github/workflows/build_daily_counter.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Daily Counter APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set Gradle Wrapper Permissions
        run: chmod +x Daily_Counter/android/gradlew

      - name: Install Dependencies
        run: |
          cd Daily_Counter
          flutter pub get

      - name: Analyze Code
        run: |
          cd Daily_Counter
          flutter analyze --no-fatal-infos

      - name: Run All Automated Tests
        run: |
          cd Daily_Counter
          flutter test

      - name: Build Release APK
        run: |
          cd Daily_Counter
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-counter-release-apk
          path: Daily_Counter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
